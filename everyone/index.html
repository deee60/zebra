<style>
  :root{
    --paper:#F5F3ED;
    --card:#FBFAF6;
    --ink:#26221C;
    --ink-soft:#332F28;
    --grey:#5A554C;
    --faint:#A9A297;
    --line:#e3ded3;
    --gold:#b0975a;
    --serif:'Noto Serif KR', serif;
    --latin:'Cormorant Garamond', serif;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html{-webkit-text-size-adjust:100%;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:var(--serif);
    font-weight:300;
    line-height:1.9;
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
  }
  .wrap{
    max-width:600px;
    margin:0 auto;
    padding:92px 0 88px;
  }
  h1{
    font-family:var(--serif);
    font-weight:400;
    font-size:14px;
    letter-spacing:0.24em;
    text-align:center;
    color:var(--grey);
  }

  /* ── 최신 (대형 카드, 고정) ── */
  .feature{
    margin:66px auto 0;
    max-width:400px;
    background:var(--card);
    border-radius:4px;
    padding:30px 28px 46px;
    box-shadow:0 1px 2px rgba(70,64,54,0.04), 0 6px 16px rgba(70,64,54,0.05);
  }
  .player{
    position:relative; width:100%; aspect-ratio:1;
    background:#d8d2c6 center/cover no-repeat;
    cursor:pointer; overflow:hidden; border-radius:2px;
  }
  .player .play{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; }
  .player .play::before{
    content:""; width:50px; height:50px; border-radius:50%;
    background:rgba(20,18,15,0.42); position:absolute; transition:background .3s ease;
  }
  .player:hover .play::before{ background:rgba(20,18,15,0.58); }
  .player .play::after{
    content:""; position:relative; margin-left:4px;
    border-style:solid; border-width:8px 0 8px 14px;
    border-color:transparent transparent transparent #f6f3ec;
  }
  .player iframe{ position:absolute; inset:0; width:100%; height:100%; border:0; display:block; }

  .feature .song{ font-family:var(--latin); font-weight:400; font-size:22px; text-align:center; margin-top:40px; color:var(--ink); line-height:1.3; }
  .feature .artist{ font-family:var(--latin); font-style:italic; font-weight:300; font-size:15px; text-align:center; color:var(--grey); margin-top:6px; }
  .feature .note-label{ font-family:var(--serif); font-weight:300; font-size:11px; letter-spacing:0.02em; text-align:center; color:var(--faint); margin-top:48px; }
  .feature .quote{ font-family:var(--serif); font-weight:300; font-size:13.5px; line-height:2.3; color:var(--ink-soft); text-align:center; margin-top:15px; }
  .feature .by{ font-family:var(--latin); font-size:10.5px; letter-spacing:0.2em; text-transform:uppercase; text-align:center; color:var(--gold); margin-top:46px; }

  /* ── 지난 곡 (가로 스크롤 썸네일) ── */
  .strip{
    margin-top:76px;
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:30px;
    padding:6px 30px 16px;
    max-width:496px;
    margin-left:auto;
    margin-right:auto;
  }
  .tile{
    flex:0 0 122px;
    width:122px;
    text-decoration:none;
    color:inherit;
  }
  .tile .frame{
    width:122px; height:122px;
    background:#d8d2c6 center/cover no-repeat;
    border-radius:2px;
    box-shadow:0 1px 2px rgba(70,64,54,0.04), 0 3px 9px rgba(70,64,54,0.05);
    transition:opacity .35s ease;
  }
  .tile:hover .frame{ opacity:.82; }
  .tile .t-song{
    font-family:var(--latin); font-weight:400; font-size:13px;
    text-align:center; color:var(--ink-soft); margin-top:11px; line-height:1.3;
  }
  .tile .t-by{
    font-family:var(--latin); font-size:8.5px; letter-spacing:0.14em;
    text-transform:uppercase; text-align:center; color:var(--faint); margin-top:3px;
  }
  .tile--note{ cursor:default; }
  .tile--note .frame{
    background:var(--card);
    display:flex; align-items:center; justify-content:center;
    box-shadow:none; border:1px solid var(--line);
  }
  .tile--note .frame p{
    font-family:var(--serif); font-weight:300; font-size:11px;
    line-height:1.95; color:var(--grey); text-align:center;
  }
  .tile--blank{ pointer-events:none; }
  .tile--blank .frame{
    background:var(--card);
    box-shadow:none;
    border:1px solid var(--line);
    opacity:0.5;
  }

  /* ── 링크 ── */
  .links{ text-align:center; margin-top:80px; }
  .links a{ font-family:var(--latin); font-size:13px; letter-spacing:0.16em; color:var(--faint); text-decoration:none; transition:color .3s ease; }
  .links a:hover{ color:var(--gold); }
  .colophon{ text-align:center; margin-top:70px; font-family:var(--latin); font-style:italic; font-weight:300; font-size:12px; letter-spacing:0.18em; color:var(--faint); }
  .homenav{ text-align:center; margin-top:16px; }
  .homenav a{ font-family:var(--latin); font-size:12px; letter-spacing:0.16em; color:var(--faint); text-decoration:none; transition:color .3s ease; }
  .homenav a:hover{ color:var(--gold); }

  @media (max-width:480px){
    .wrap{ padding:60px 0 64px; }
    h1{ font-size:14px; letter-spacing:0.2em; }
    .feature{ margin-top:46px; padding:22px 20px 34px; max-width:none; margin-left:32px; margin-right:32px; }
    .feature .song{ font-size:20px; }
    .strip{
      justify-content:center;
      padding:6px 20px 16px;
      gap:14px;
      max-width:312px;
    }
    .tile{ flex:0 0 88px; width:88px; }
    .tile .frame{ width:88px; height:88px; }
    .tile--note .frame p{ font-size:10px; line-height:1.8; }
  }
  /* copy guard (same as issue pages): block text selection; right-click/copy via script below */
  html,body{ -webkit-user-select:none; -moz-user-select:none; -ms-user-select:none; user-select:none; -webkit-touch-callout:none; }
  a,button,iframe,input,textarea{ -webkit-user-select:auto; user-select:auto; }
  /* 겨울 배경: 랜딩과 같은 서리 숲(아이보리) + 흰 눈 */
  html{background:#eeece7}
  html body{background:transparent}
  body::before{content:'';position:fixed;left:0;right:0;top:0;height:100vh;z-index:-1;pointer-events:none;
    background:url(/frost-winter-v3.jpg) center top/cover no-repeat;
    -webkit-mask-image:linear-gradient(#000 0%,#000 40%,transparent 88%);mask-image:linear-gradient(#000 0%,#000 40%,transparent 88%)}
  #snow{position:fixed;inset:0;width:100%;height:100%;z-index:-1;pointer-events:none}
  /* 페이지 사이를 디졸브로 (랜딩 · 모두의 큐레이션 · B-SIDE · 취향의 발견 · 플레이리스트) */
  @view-transition{navigation:auto}
  ::view-transition-old(root),::view-transition-new(root){animation-duration:.9s;animation-timing-function:ease}
  @supports not (view-transition-name:none){ body{animation:zbFadeIn .9s ease both} }
  @keyframes zbFadeIn{from{opacity:0}to{opacity:1}}
.cnav{display:flex;justify-content:center;gap:10px;margin:14px 0 -4px}
.cnav a,.cnav b{display:block;width:3px;height:3px;border-radius:50%;background:#c4beb2;opacity:.7;position:relative}
.cnav b{background:#8f897d;opacity:.8}
.cnav a::after{content:"";position:absolute;inset:-10px}

  <main class="wrap">

    <h1>모 두 의 &nbsp;큐 레 이 션</h1>

    <div id="feature"></div>

    <div class="strip" id="strip"></div>

    <div class="links"><a href="https://docs.google.com/forms/d/e/1FAIpQLSd1QNkACgZKkzzzqdDL5StQrgHiXEiaIU1elF3JoKsjO_5TYQ/viewform" target="_blank" rel="noopener">추천하기</a></div>
    <div class="colophon">zebra beta &middot; movement 2.</div>
    <div class="homenav"><a href="https://zebrabeta.kr">HOME</a></div>

  </main>

  <script>
  (function(){
    function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
    function nl2br(s){ return esc(s).replace(/\n/g,'<br>'); }

    var DATA = [];
    var current = 0;

    function bindPlayer(p, title){
      if(!p) return;
      p.addEventListener('click', function(){
        if(p.dataset.played) return; p.dataset.played='1';
        var f=document.createElement('iframe');
        f.setAttribute('src', p.getAttribute('data-embed'));
        f.setAttribute('title', title||'');
        f.setAttribute('allow','accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture');
        f.setAttribute('allowfullscreen','');
        p.innerHTML=''; p.appendChild(f); p.style.cursor='default';
      });
    }

    function renderFeature(item){
      var wrap=document.getElementById('feature');
      wrap.innerHTML='';
      var card=document.createElement('div');
      card.className='feature';
      card.innerHTML=
        '<div class="player" data-embed="https://www.youtube.com/embed/'+esc(item.youtube)+'?autoplay=1" style="background-image:url(\''+esc(item.cover)+'\');">'+
          '<div class="play" aria-hidden="true"></div>'+
        '</div>'+
        '<div class="song">'+esc(item.title)+'</div>'+
        '<div class="artist">'+esc(item.artist)+'</div>'+
        (item.note ? '<div class="note-label">한줄 소개</div><div class="quote">&ldquo;'+nl2br(item.note)+'&rdquo;</div>' : '')+
        (item.by ? '<div class="by">Curated by '+esc(item.by)+'</div>' : '');
      wrap.appendChild(card);
      bindPlayer(card.querySelector('.player'), item.title);
    }

    function renderStrip(){
      var strip=document.getElementById('strip');
      strip.innerHTML='';
      var others=[];
      DATA.forEach(function(item, idx){ if(idx!==current) others.push(idx); });

      function noteTile(){
        var n=document.createElement('div');
        n.className='tile tile--note';
        n.innerHTML='<div class="frame"><p>당신의 추천을<br>함께 합니다</p></div>';
        return n;
      }
      function blankTile(){
        var b=document.createElement('div');
        b.className='tile tile--blank';
        b.innerHTML='<div class="frame"></div>';
        return b;
      }
      function songTile(idx){
        var item=DATA[idx];
        var a=document.createElement('a');
        a.className='tile';
        a.href = item.slug ? '/everyone/'+item.slug+'/' : 'javascript:void(0)';
        a.innerHTML=
          '<div class="frame" style="background-image:url(\''+esc(item.cover)+'\');"></div>'+
          '<div class="t-song">'+esc(item.title)+'</div>'+
          (item.by ? '<div class="t-by">'+esc(item.by)+'</div>' : '');
        a.addEventListener('click', function(e){
          e.preventDefault();
          current=idx; renderFeature(DATA[current]); renderStrip();
          window.scrollTo({ top:0, behavior:'smooth' });
        });
        return a;
      }

      if(others.length===0){
        strip.appendChild(noteTile());
        strip.appendChild(blankTile());
        strip.appendChild(blankTile());
      } else {
        strip.appendChild(noteTile());
        others.forEach(function(idx){ strip.appendChild(songTile(idx)); });
      }
    }

    fetch('everyone.json', {cache:'no-cache'})
      .then(function(r){ return r.json(); })
      .then(function(list){
        if(!Array.isArray(list) || list.length===0) return;
        var isPreview = location.search.indexOf("preview") !== -1;
        list = list.filter(function(x){ return isPreview || x.published !== false; });
        if(list.length===0) return;
        DATA = list;
        current = 0;
        renderFeature(DATA[0]);
        renderStrip();
      })
      .catch(function(e){ console.error('everyone.json load failed', e); });
  })();
  </script>

<canvas id="snow" aria-hidden="true"></canvas>
<script>
  /* 흰 눈: 스텔라장 「나의 겨울 여행」처럼 — 작고 또렷한 눈송이와 크고 흐린 눈송이(초점 밖)가 섞여 천천히 */
  (function(){
    if (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    var c=document.getElementById('snow'), x=c.getContext('2d'), W, H, dpr=Math.min(2, window.devicePixelRatio||1), flakes=[];
    function size(){ W=c.clientWidth||innerWidth; H=c.clientHeight||innerHeight; c.width=W*dpr; c.height=H*dpr; x.setTransform(dpr,0,0,dpr,0,0); }
    var t0 = Date.now();
    function mk(top){
      var big = top && (Date.now() - t0 > 4000) && Math.random() < .14, r = big ? 5+Math.random()*7 : 2+Math.random()*2.6;
      return { x:Math.random(), y: top ? -r*2 : Math.random()*H, r:r, big:big,
               v: big ? .35+Math.random()*.45 : .45+Math.random()*.7,   // 큰 송이는 가까워서 느리고 흐리다
               a: Math.random()*6.28, s: .003+Math.random()*.007, w: .25+Math.random()*.5,
               o: big ? .38+Math.random()*.25 : .85+Math.random()*.15 };
    }
    function draw(f){
      var px = f.x*W; var g = x.createRadialGradient(px, f.y, 0, px, f.y, f.r);
      if (f.big){ g.addColorStop(0,'rgba(255,255,255,'+f.o+')'); g.addColorStop(.55,'rgba(255,255,255,'+(f.o*.7)+')'); g.addColorStop(1,'rgba(255,255,255,0)'); }
      else { g.addColorStop(0,'rgba(255,255,255,'+f.o+')'); g.addColorStop(.35,'rgba(255,255,255,'+(f.o*.75)+')'); g.addColorStop(1,'rgba(255,255,255,0)'); }
      x.shadowColor = f.big ? 'rgba(110,100,85,.18)' : 'rgba(100,90,75,.32)'; x.shadowBlur = f.big ? 10 : 6;
      x.beginPath(); x.arc(px, f.y, f.r, 0, 6.283); x.fillStyle = g; x.fill();
    }
    size(); var n = W < 600 ? 34 : 60; for (var i=0;i<n;i++) flakes.push(mk(false));
    addEventListener('resize', size);
    (function tick(){
      if (c.clientWidth && (Math.abs(c.clientWidth-W)>2 || Math.abs(c.clientHeight-H)>2)) size();
      x.clearRect(0,0,W,H);
      for (var i=0;i<flakes.length;i++){
        var f=flakes[i]; f.y+=f.v; f.a+=f.s; f.x+=Math.sin(f.a)*f.w/(W||1000);
        if (f.y>H+f.r*2){ flakes[i]=mk(true); continue; }
        draw(f);
      }
      requestAnimationFrame(tick);
    })();
  })();
</script>
