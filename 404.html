<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>지브라 베타</title>
<link rel="icon" href="/favicon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@300;400&family=Cormorant+Garamond:ital,wght@0,400;1,300&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;height:100%;background:#eeece7;color:#5a554c;-webkit-font-smoothing:antialiased}
  .wrap{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 24px;box-sizing:border-box}
  .msg{font-family:'Noto Serif KR',serif;font-weight:300;font-size:13.5px;letter-spacing:.04em;line-height:2}
  .home{margin-top:34px;font-family:'Cormorant Garamond',serif;font-size:12px;letter-spacing:.22em;color:#a9a297;text-decoration:none;transition:color .3s}
  .home:hover{color:#b89a5a}
  .colophon{position:fixed;left:0;right:0;bottom:28px;text-align:center;font-family:'Cormorant Garamond',serif;font-style:italic;font-weight:300;font-size:12px;letter-spacing:.18em;color:#a9a297}
</style>
</head>
<body>
<div class="wrap">
  <p class="msg">없는 페이지이거나, 자리를 옮겼습니다.</p>
  <a class="home" href="/">HOME</a>
</div>
<p class="colophon">zebra beta movement 2.</p>
</body>
</html>
