<style>
  :root{ --paper:#F5F3ED; --ink:#26221C; --mid:#6E6A61; --faint:#A9A297; --rule:#DFDAD0; }
  *{ margin:0; padding:0; box-sizing:border-box; }
  html{ -webkit-text-size-adjust:100%; }
  body{ background:#EDEBE4; display:flex; justify-content:center;
        font-family:"Noto Serif KR", serif; color:var(--ink); }
  .sheet{
    background:var(--paper); width:100%; max-width:720px; min-height:100dvh;
    display:flex; flex-direction:column; align-items:center;
    padding:0 30px;
    box-shadow:0 0 60px rgba(70,60,45,.07);
    animation:settle 1.2s ease both;
  }
  @keyframes settle{ from{opacity:0;} to{opacity:1;} }
  @media (prefers-reduced-motion: reduce){ .sheet{ animation:none; } }

  .notice{
    margin-top:26px;
    max-width:340px;
    text-align:center;
    word-break:keep-all;
    font-size:11px; letter-spacing:.13em; text-indent:.13em;
    line-height:1.95;
    color:var(--faint);
  }

  .plate{ margin-top:clamp(56px, 10vh, 96px); width:min(46%, 258px); }
  .plate img{ width:100%; display:block; }

  .titles{ text-align:center; margin-top:clamp(48px, 8vh, 76px); }
  .titles .series{ font-size:14px; font-weight:500; color:var(--ink); letter-spacing:.1em; }
  .titles h1{
    margin-top:22px;
    font-size:clamp(38px, 7.5vw, 46px);
    font-weight:400; letter-spacing:.08em; line-height:1.25;
  }
  .titles .artist{
    margin-top:10px;
    font-family:"Cormorant Garamond", serif; font-style:italic; font-weight:500;
    font-size:19px; color:var(--mid); letter-spacing:.05em;
  }

  .void{
    flex:1;
    display:flex; align-items:center; justify-content:center;
    width:100%;
    min-height:clamp(300px, 42vh, 460px);
    padding:clamp(64px, 10vh, 110px) 0;
  }
  .note{
    width:min(100%, 420px);
    font-size:15.5px; line-height:2.15; color:#332F28; word-break:keep-all;
  }
  .note p + p{ margin-top:1.6em; text-indent:1em; }
  .note:empty{ display:none; }

  .listen{ text-align:center; padding-bottom:8px; }
  .listen-row{
    display:flex; justify-content:center; align-items:center;
    flex-wrap:wrap; column-gap:24px; row-gap:8px;
  }
  .listen-row + .listen-row{ margin-top:13px; }
  .listen-row a{
    display:inline-flex; align-items:center; gap:6px;
    text-decoration:none; color:var(--mid);
    font-size:12px; font-weight:500; letter-spacing:.12em;
    padding:4px 0;
  }
  .listen-row a.latin{
    font-family:"Cormorant Garamond", serif;
    font-size:14px; letter-spacing:.08em;
  }
  .listen-row a:hover, .listen-row a:focus-visible{
    color:var(--ink); text-decoration:underline;
    text-underline-offset:5px; text-decoration-thickness:1px;
  }
  .listen-row a:focus-visible{ outline:none; }
  .listen-row svg{ width:13.5px; height:13.5px; flex:0 0 13.5px; }

  .film{ width:min(100%, 460px); margin:clamp(44px, 7vh, 64px) auto 0; }
  .film .mat{ background:#FCFBF8; border:1px solid var(--rule); padding:4.5px; }
  .film .frame{ position:relative; padding-top:56.25%; background:#111; }
  .film iframe{ position:absolute; inset:0; width:100%; height:100%; border:0; }
  .film figcaption{
    margin-top:11px; text-align:center;
    font-family:"Cormorant Garamond", serif; font-style:italic;
    font-size:13.5px; color:var(--faint); letter-spacing:.06em;
  }

  .colophon{
    margin-top:clamp(40px, 7vh, 64px);
    padding-bottom:34px;
    font-family:"Cormorant Garamond", serif; font-style:italic;
    font-size:12.5px; color:var(--faint);
    letter-spacing:.2em; text-indent:.2em;
  }

  /* 만료 화면 */
  .spacer{ flex:1; }
  .moved{ text-align:center; }
  .moved .series{ font-size:14px; font-weight:500; letter-spacing:.1em; color:var(--ink); }
  .moved .rule{ width:30px; height:1px; background:var(--faint); margin:26px auto; border:0; }
  .moved .line{ font-size:15.5px; color:var(--mid); letter-spacing:.05em; }
  .moved .sub{ margin-top:14px; font-size:12.5px; color:var(--faint); letter-spacing:.08em; }
</style>
