<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- ═══════════════════════════════════════════════════════
     ZEBRA 링크 페이지 템플릿 v2
     · 맨 위 = 그래픽 자리 (매 볼륨 디자인이 달라져도 이미지만 교체)
     · 아래 = song.link 스타일 플랫폼 리스트
     새 볼륨: 아래 ZEBRA 설정의 graphic / 제목 / 링크만 바꾸면 됩니다.
     ═══════════════════════════════════════════════════════ -->

<title>시 — Colde | 여름밤 03</title>
<meta name="description" content="여름밤 03 — Apple Music, Spotify, YouTube Music, TIDAL, 멜론, 지니, 벅스에서 듣기">

<!-- 카카오톡/인스타 미리보기 카드 (호스팅 후 og:image에 실제 이미지 주소를 넣으세요) -->
<meta property="og:title" content="시 — Colde">
<meta property="og:description" content="여름밤 03 · zebra beta movement 2.">
<meta property="og:type" content="music.song">
<!-- <meta property="og:image" content="https://내주소/ZEBRA_vol33.png"> -->

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<script>
/* ─────────── 여기만 수정하면 됩니다 ─────────── */
const ZEBRA = {
  /* 페이지 제목·미리보기용 정보 */
  title:  "시",
  artist: "Colde",
  volume: "여름밤 03",

  /* 맨 위 그래픽: 파일로 쓰려면 "vol33.png" 처럼 파일명을 적고
     같은 폴더에 이미지를 넣으세요. 지금은 이미지가 내장돼 있습니다. */
  graphic: "summernight03.jpg",

  /* 유튜브 임베드 영상 ID (비우면 영상 카드가 안 뜨) */
  youtubeEmbed: "0AMJQsysRG4",

  /* 만료일 — 이 시각이 지나면 링크가 닫힙니다 (비우면 무기한) */
  expires: "2026-07-31T23:59:59+09:00",

  links: [
    { id: "apple",   name: "Apple Music",   url: "https://music.apple.com/kr/song/%EC%8B%9C/1781864894" },
    { id: "spotify", name: "Spotify",       url: "https://open.spotify.com/track/2dz4JC7WduddrM0Qt9iEQz" },
    { id: "ytmusic", name: "YouTube Music", url: "https://music.youtube.com/watch?v=0AMJQsysRG4" },
    { id: "tidal",   name: "TIDAL",         url: "https://listen.tidal.com/track/401960337" },
    { id: "melon",   name: "멜론",          url: "https://www.melon.com/song/detail.htm?songId=31456126" },
    { id: "genie",   name: "지니",          url: "https://www.genie.co.kr/detail/songInfo?xgnm=88417084" },
    { id: "bugs",    name: "벅스",          url: "https://music.bugs.co.kr/track/5511558" }
  ]
};
/* ───────────────────────────────────────────── */
</script>

<style>
  :root{
    --bg:    #F2F1EF;   /* 기본값 — 그래픽에서 색을 뽑아 자동으로 덮어씁니다 */
    --card:  #FFFFFF;
    --ink:   #1F2430;
    --muted: #7A8090;
    --line:  #EEECE7;
    --pill:  #D9D5CB;
  }
  *{ margin:0; padding:0; box-sizing:border-box; }
  body{
    background:var(--bg);
    transition:background .6s ease;
    font-family:"Inter", -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", sans-serif;
    color:var(--ink);
    display:flex; justify-content:center;
    min-height:100dvh;
    padding:clamp(16px,4vh,44px) 16px 56px;
  }
  .wrap{ width:100%; max-width:480px; animation:rise .7s cubic-bezier(.22,.7,.3,1) both; }
  @keyframes rise{ from{opacity:0; transform:translateY(12px);} to{opacity:1; transform:none;} }
  @media (prefers-reduced-motion: reduce){ .wrap{ animation:none; } .row,.play{ transition:none !important; } }

  /* ① 그래픽 자리 — 볼륨마다 이미지가 통째로 바뀌는 영역 */
  .graphic{
    border-radius:20px 20px 0 0; overflow:hidden;
    box-shadow:0 22px 60px rgba(50,44,32,.16), 0 4px 14px rgba(50,44,32,.08);
  }

  /* song.link 스타일 액션 바 (링크 복사 · 공유) */
  .actions{
    display:flex;
    background:#FBFAF8;
    border-radius:0 0 20px 20px;
    box-shadow:0 14px 40px rgba(50,44,32,.10), 0 2px 8px rgba(50,44,32,.06);
    margin-bottom:18px;
    overflow:hidden;
  }
  .actions button{
    flex:1; padding:14px 0;
    background:none; border:0; cursor:pointer;
    font-family:inherit; font-size:14px; font-weight:600;
    color:#3B7DD8;
    transition:background .15s ease;
  }
  .actions button + button{ border-left:1px solid var(--line); }
  .actions button:hover{ background:#F3F1EC; }
  .graphic img{ width:100%; display:block; }

  /* ② song.link 스타일 리스트 카드 */
  .listen{
    background:var(--card);
    border-radius:18px;
    box-shadow:0 14px 40px rgba(50,44,32,.10), 0 2px 8px rgba(50,44,32,.06);
    padding:22px 22px 8px;
  }
  .listen h2{
    font-size:15px; font-weight:600; letter-spacing:.01em;
    margin:0 2px 6px;
  }
  .rows{ list-style:none; }
  .row{
    display:flex; align-items:center; gap:16px;
    padding:15px 2px;
    border-bottom:1px solid var(--line);
    text-decoration:none; color:inherit;
    transition:background .2s ease;
  }
  .rows li:last-child .row{ border-bottom:0; }
  .row .icon{ width:40px; height:40px; flex:0 0 40px; }
  .row .icon svg{ width:100%; height:100%; display:block; }
  .row .name{ flex:1; font-size:16px; font-weight:500; letter-spacing:-.01em; }
  .play{
    font-size:13.5px; font-weight:600; color:#6B7280;
    border:1px solid #DDD9CF; border-radius:999px;
    padding:8px 21px;
    transition:color .2s ease, border-color .2s ease, background .2s ease;
  }
  .row:hover .play, .row:focus-visible .play{
    color:var(--ink); border-color:var(--ink); background:#FAF9F6;
  }
  .row:focus-visible{ outline:none; }
  .row:focus-visible .name{ text-decoration:underline; }

  /* ③ 유튜브 임베드 카드 */
  .watch{
    margin-top:18px;
    border-radius:18px; overflow:hidden;
    box-shadow:0 14px 40px rgba(50,44,32,.10), 0 2px 8px rgba(50,44,32,.06);
    position:relative; padding-top:56.25%;
    background:#000;
  }
  .watch iframe{
    position:absolute; inset:0; width:100%; height:100%; border:0;
  }

  /* 하단 작은 마무리 */
  .foot{
    text-align:center; margin-top:22px;
    font-size:12px; letter-spacing:.24em; text-indent:.24em;
    color:#A9A395; font-family:Georgia, serif; font-style:italic;
  }
</style>
</head>
<body>
  <main class="wrap">
    <figure class="graphic"><img id="graphic" alt=""></figure>
    <div class="actions">
      <button id="copyBtn" type="button">링크 복사</button>
      <button id="shareBtn" type="button">공유</button>
    </div>

    <section class="listen" aria-label="스트리밍 플랫폼">
      <h2>Listen</h2>
      <ul class="rows" id="rows"></ul>
    </section>

    <div class="watch" id="watch" hidden></div>

    <p class="foot" id="foot"></p>
  </main>

<script>
/* 카카오톡 인앱 브라우저 탈출 — 외부 브라우저로 열어야 앱 연결이 제대로 됩니다 */
if (/KAKAOTALK/i.test(navigator.userAgent)) {
  location.href = "kakaotalk://web/openExternal?url=" + encodeURIComponent(location.href);
}

/* ── 플랫폼 아이콘 (수정할 필요 없음) ── */
const ICONS = {
  spotify: `<svg viewBox="0 0 38 38"><circle cx="19" cy="19" r="19" fill="#1ED760"/><path d="M10.4 15c5.8-1.8 12.5-1.1 17.2 1.7" stroke="#191414" stroke-width="2.4" fill="none" stroke-linecap="round"/><path d="M11.2 19.7c4.9-1.4 10.4-.8 14.3 1.5" stroke="#191414" stroke-width="2" fill="none" stroke-linecap="round"/><path d="M12 24.1c4-1.1 8.4-.6 11.5 1.3" stroke="#191414" stroke-width="1.7" fill="none" stroke-linecap="round"/></svg>`,
  apple: `<svg viewBox="0 0 38 38"><defs><linearGradient id="am2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FB5C74"/><stop offset="1" stop-color="#FA233B"/></linearGradient></defs><rect width="38" height="38" rx="9" fill="url(#am2)"/><path d="M26.3 9.6l-10.4 2.2c-.6.1-1 .6-1 1.2v9.1a3.8 3.8 0 1 0 2 3.3V15.2l7.9-1.7v5.9a3.8 3.8 0 1 0 2 3.3V10.6c0-.6-.6-1.1-1.2-1z" fill="#fff"/></svg>`,
  ytmusic: `<svg viewBox="0 0 38 38"><circle cx="19" cy="19" r="19" fill="#FF0000"/><circle cx="19" cy="19" r="11" fill="none" stroke="#fff" stroke-width="2.1"/><path d="M16.2 14.7l7.6 4.3-7.6 4.3z" fill="#fff"/></svg>`,
  youtube: `<svg viewBox="0 0 38 38"><rect x="1.5" y="7.5" width="35" height="23" rx="6.5" fill="#FF0000"/><path d="M15.6 13.6l9.1 5.4-9.1 5.4z" fill="#fff"/></svg>`,
  tidal: `<svg viewBox="0 0 38 38"><rect width="38" height="38" rx="9" fill="#111"/><path d="M12.3 11.5l3.8 3.8-3.8 3.8-3.8-3.8zM19.9 11.5l3.8 3.8-3.8 3.8-3.8-3.8zM27.5 15.3l-3.8 3.8 3.8 3.8 3.8-3.8-3.8-3.8zM19.9 19.1l3.8 3.8-3.8 3.8-3.8-3.8z" fill="#fff" transform="translate(-2.4 1.8) scale(.95)"/></svg>`,
  melon: `<svg viewBox="0 0 38 38"><circle cx="19" cy="19" r="19" fill="#00CD3C"/><path d="M23.5 9.5v11.2a4 4 0 1 0 2 3.4V13l-9 2v8.9a4 4 0 1 0 2 3.4V11.6z" fill="#fff" transform="translate(-2.2 -1.2) scale(.98)"/></svg>`,
  genie: `<svg viewBox="0 0 38 38"><rect width="38" height="38" rx="9" fill="#1DB0EC"/><text x="19" y="26" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#fff">ge</text></svg>`,
  bugs: `<svg viewBox="0 0 38 38"><rect width="38" height="38" rx="9" fill="#F5323C"/><text x="19" y="26" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#fff">b!</text></svg>`
};

document.title = `${ZEBRA.title} — ${ZEBRA.artist} | ${ZEBRA.volume}`;
graphic.src = ZEBRA.graphic;
graphic.alt = `${ZEBRA.volume} — ${ZEBRA.title}, ${ZEBRA.artist}`;
foot.textContent = "Zebra Beta";

/* 링크 복사 · 공유 (song.link 스타일) */
const pageUrl = location.origin + location.pathname;
copyBtn.addEventListener("click", async () => {
  try{
    await navigator.clipboard.writeText(pageUrl);
    copyBtn.textContent = "복사됨 ✓";
    setTimeout(() => copyBtn.textContent = "링크 복사", 1600);
  }catch(e){ prompt("아래 주소를 복사하세요", pageUrl); }
});
shareBtn.addEventListener("click", async () => {
  if (navigator.share) {
    try{ await navigator.share({ title: document.title, url: pageUrl }); }catch(e){}
  } else {
    copyBtn.click();
  }
});

/* 그래픽 가장자리 색을 뽑아 페이지 배경으로 (볼륨마다 자동으로 맞춰짐) */
graphic.addEventListener("load", () => {
  try{
    const c = document.createElement("canvas"), s = 24;
    c.width = s; c.height = s;
    const ctx = c.getContext("2d");
    ctx.drawImage(graphic, 0, 0, s, s);
    const px = ctx.getImageData(0, 0, s, s).data;
    let r=0,g=0,b=0,n=0;
    // 테두리 픽셀만 평균
    for(let y=0;y<s;y++) for(let x=0;x<s;x++){
      if(x>2 && x<s-3 && y>2 && y<s-3) continue;
      const i=(y*s+x)*4; r+=px[i]; g+=px[i+1]; b+=px[i+2]; n++;
    }
    r=Math.round(r/n); g=Math.round(g/n); b=Math.round(b/n);
    document.documentElement.style.setProperty("--bg", `rgb(${r},${g},${b})`);
    // 배경 밝기에 따라 푸터 글자색 조정
    const lum = (0.299*r + 0.587*g + 0.114*b);
    document.querySelector(".foot").style.color =
      lum > 140 ? "rgba(60,55,45,.45)" : "rgba(255,255,255,.55)";
  }catch(e){ /* 색 추출 실패 시 기본 배경 유지 */ }
});
if (graphic.complete) graphic.dispatchEvent(new Event("load"));

rows.innerHTML = ZEBRA.links.filter(l => l.url).map(l => `
  <li><a class="row" href="${l.url}" target="_blank" rel="noopener">
    <span class="icon">${ICONS[l.id] || ""}</span>
    <span class="name">${l.name}</span>
    <span class="play">Play</span>
  </a></li>`).join("");

/* 유튜브 임베드 플레이어 */
if (ZEBRA.youtubeEmbed) {
  watch.hidden = false;
  watch.innerHTML = `<iframe src="https://www.youtube-nocookie.com/embed/${ZEBRA.youtubeEmbed}" title="YouTube" loading="lazy" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe>`;
}

/* 기한 만료 처리 */
if ((ZEBRA.expires && Date.now() > new Date(ZEBRA.expires).getTime()) || location.search.includes("preview=expired")) {
  document.querySelector(".listen").innerHTML = '<h2>Listen</h2><p style="padding:18px 2px 16px;color:var(--muted);font-size:15px;">이 큐레이션의 공개 기간이 종료되었습니다.</p>';
  watch.hidden = true; watch.innerHTML = "";
  document.querySelector(".actions").style.display = "none";
}
</script>
</body>
</html>
