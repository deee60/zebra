<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- ZEBRA BETA 지면 · build.py 자동 생성 · 직접 수정하지 말고 issues/*.json 을 고칠 것 -->
<title>{{PAGE_TITLE}}</title>
<meta name="description" content="zebra beta movement 2.">
<meta property="og:title" content="{{OG_TITLE}}">
<meta property="og:description" content="{{OG_DESC}}">
<meta property="og:image" content="https://zebrabeta.kr/zebra-og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:type" content="article">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@300;400;500&family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,500&display=swap" rel="stylesheet">
<script>
/* 카카오톡 인앱 브라우저 탈출 */
if (/KAKAOTALK/i.test(navigator.userAgent)) {
  location.href = "kakaotalk://web/openExternal?url=" + encodeURIComponent(location.href);
}
</script>
<style>
{{CSS}}
</style>
</head>
<body>

  <main class="sheet {{LAYOUT}}" id="sheet">

    <p class="notice">{{NOTICE}}</p>

{{UPPER}}

    <div class="void">
      <div class="note">{{NOTE}}</div>
    </div>

    <footer class="listen">
{{LISTEN}}
    </footer>

{{FILM}}

    <p class="colophon">zebra beta · movement 2.</p>

  </main>

<script>
/* 이관(만료) 처리 — 표준 블록. EXPIRES 는 build.py 가 발행시각+72시간으로 계산 */
const EXPIRES = "{{EXPIRES}}";
const isExpired = Date.now() > new Date(EXPIRES).getTime() || location.search.includes("preview=expired");
const isArchive = location.search.includes("archive=1");
if (isExpired && !isArchive) {
  document.getElementById("sheet").innerHTML = `
    <div class="spacer"></div>
    <div class="moved">
      <hr class="rule">
      <p class="line">이 큐레이션은 아카이브로 이관되었습니다</p>
      <p class="sub">지브라의 큐레이션은 발행 후 72시간 동안 열립니다.<br>이후 아카이브로 옮겨지며,<br>아카이브는 V1.0부터 회원에게 열립니다.</p>
      <p class="home"><a href="https://zebrabeta.kr">지브라 베타</a></p>
    </div>
    <div class="spacer"></div>
    <p class="colophon">zebra beta · movement 2.</p>`;
}
</script>

<script>
(function(){
  var block=function(e){ e.preventDefault(); return false; };
  document.addEventListener("contextmenu", block);
  document.addEventListener("copy", block);
  document.addEventListener("cut", block);
  document.addEventListener("dragstart", block);
})();
</script>
</body>
</html>
