<div class="r-body"><p>올해 만 85세가 넘으신 할머니는 정원을 텃밭으로 일구어 쓰시는데 길고양이가 매일 집으로 찾아와 나무 밑둥 위에 한참을 머물다 갔다고 합니다.  하지만 얼마전부터 발길을 끊어 할머니가 걱정중이십니다. 어떻게 배우셨는지 스마트폰으로 찍어 놓으신 걸 구도를 조금 손보고 흑백으로 바꿔봤습니다. 고양아 빨리 돌아와! 할머니가 걱정하셔...</p><figure class="r-photo r-photo-2"><img src="https://zebrabeta.kr/taste/grannycat/duo.jpg" alt="텃밭 고랑 끝, 문 앞에 앉은 길고양이"><figcaption>사진 · 석류</figcaption></figure><div class="clear"></div></div><div class="r-foot">할머니의 아명은 석류였다고 합니다. 동생들을 석류처럼 많이 보라고 석류라고 불렀다고 하네요.</div>
