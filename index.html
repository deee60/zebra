<script>
  var f=document.getElementById('stbForm'),
      email=document.getElementById('email'),
      agree=document.getElementById('agree'),
      msg=document.getElementById('msg'),
      pBtn=document.getElementById('policyBtn'),
      pText=document.getElementById('policyText');

  pBtn.addEventListener('click',function(){
    var open=!pText.hidden;
    pText.hidden=open;
    pBtn.textContent=open?'내용 보기':'닫기';
  });

  var hint=document.getElementById('scrollHint');
  if(hint){
    window.addEventListener('scroll',function(){
      if(window.scrollY>40) hint.classList.add('hidden');
      else hint.classList.remove('hidden');
    },{passive:true});
  }

  f.addEventListener('submit',function(e){
    var v=email.value.trim();
    if(!v||!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v)){
      e.preventDefault();
      msg.textContent='올바른 이메일 주소를 입력해주세요.';
      return;
    }
    if(!agree.checked){
      e.preventDefault();
      msg.textContent='개인정보 수집 및 이용에 동의해주세요.';
      return;
    }
    msg.textContent='감사합니다. V1.0이 오픈하면 알려드리겠습니다.';
    setTimeout(function(){ email.value=''; agree.checked=false; },300);
  });
</script>

<script>
(function(){
  var START=new Date("2026-10-29T16:00:00+09:00").getTime(),
      END=new Date("2026-11-01T23:59:59+09:00").getTime(),
      DEST="issue/halloween26/", KEY="zb_ink_halloween26";

  if(!force){ try{ if(localStorage.getItem(KEY)) return; }catch(e){} }

  function r(a,b){ return a+(b-a)*Math.random(); }
  var box=document.getElementById("zbInk");

  function begin(){
    try{ localStorage.setItem(KEY,"1"); }catch(e){}
    box.classList.add("on"); document.documentElement.style.overflow="hidden";
  }
  function finish(closeAt){
    setTimeout(function(){ box.classList.add("close"); }, closeAt);

  /* ── 기본: WebGL 액체 잉크 ── 한 줄기가 먼저 떨어져 멈추고, 위쪽 막이 들쭉날쭉 쏟아지며 중간 줄기 넷이 빠져나온다 */
  function startGL(){
    var cv=document.createElement("canvas");
    box.insertBefore(cv, box.firstChild);
    var gl=cv.getContext("webgl2",{premultipliedAlpha:true,alpha:true,antialias:false});
    if(!gl){ box.removeChild(cv); return false; }
    var MAXF=8;
    var VS="#version 300 es\nin vec2 a;void main(){gl_Position=vec4(a,0.,1.);}";
    var FS=[
    "#version 300 es","precision highp float;",
    "uniform vec2 uRes;uniform float uT;uniform float uSeed;uniform int uN;uniform vec4 uF["+MAXF+"];",
    "out vec4 o;",
    "float h1(float n){return fract(sin(n)*43758.5453);}",
    "float vn(float x){float i=floor(x),f=fract(x);float u=f*f*(3.-2.*f);return mix(h1(i),h1(i+1.),u);}",
    "float smin(float a,float b,float k){float h=clamp(.5+.5*(b-a)/k,0.,1.);return mix(b,a,h)-k*h*(1.-h);}",
    "void main(){",
    " float H=uRes.y; vec2 p=vec2(gl_FragCoord.x/H, 1.-gl_FragCoord.y/H);",
    " float t=uT;",
    " float st0=2.35+0.6*vn(p.x*1.9+uSeed*1.7)+0.25*vn(p.x*7.+uSeed);",
    " float g=0.36+0.3*vn(p.x*2.7+uSeed*3.3)*vn(p.x*8.+uSeed);",
    " float ts=max(t-st0,0.);",
    " float F=-0.035+0.016*vn(p.x*6.+uSeed)+0.008*vn(p.x*23.+uSeed*2.)+0.03*vn(p.x*14.+uSeed*5.)*min(ts,1.)+0.5*g*ts*ts;",
    " float d=p.y-F;",
    " for(int i=0;i<"+MAXF+";i++){",
    "  if(i>=uN)break; vec4 f=uF[i]; float st=t-f.z; if(st<=0.)continue;",
    "  float acc=f.w<0.?0.026:f.w;",
    "  float L=0.012*st+0.5*acc*st*st;",
    "  if(f.w<0.){float m=-f.w; L=m*(1.-exp(-L/m));}",
    "  float tip=max(F,0.)+L;",
    "  if(p.y>tip+0.03||abs(p.x-f.x)>0.08)continue;",
    "  float w=f.y*mix(0.5,1.0,1.-clamp((tip-p.y)/0.32,0.,1.));",
    "  w*=1.+0.32*(vn(p.y*16.+f.x*37.)-.5)+0.14*(vn(p.y*47.+f.x*91.)-.5);",
    "  w*=pow(clamp((tip-p.y)/(f.y*3.2),0.,1.),0.62);",
    "  float cx=f.x+0.0011*sin(p.y*9.+f.x*51.);",
    "  float df=max(abs(p.x-cx)-w,p.y-tip);",
    "  d=smin(d,df,0.010);",
    " }",
    " float aa=1.2/H;",
    " float a=1.-smoothstep(-aa,aa,d);",
    " vec3 ink=vec3(0.110,0.106,0.094);",
    " float rim=(1.-smoothstep(0.,0.010,-d))*a;",
    " vec3 col=ink+rim*vec3(0.05,0.048,0.042);",
    " o=vec4(col*a,a);",
    "}"].join("\n");
    function sh(type,src){ var s=gl.createShader(type); gl.shaderSource(s,src); gl.compileShader(s); if(!gl.getShaderParameter(s,gl.COMPILE_STATUS)) throw gl.getShaderInfoLog(s); return s; }

      if(!gl.getProgramParameter(prog,gl.LINK_STATUS)) throw gl.getProgramInfoLog(prog);
      gl.useProgram(prog);
      var b=gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER,b); gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);
      var al=gl.getAttribLocation(prog,"a"); gl.enableVertexAttribArray(al); gl.vertexAttribPointer(al,2,gl.FLOAT,false,0,0);

    }catch(e){ box.removeChild(cv); return false; }

    function size(){ var dpr=Math.min(window.devicePixelRatio||1,1.5); cv.width=Math.round(innerWidth*dpr); cv.height=Math.round(innerHeight*dpr); gl.viewport(0,0,cv.width,cv.height); }

    var x1=r(0.22,0.42), x2=r(0.56,0.78), x3=(x1+x2)/2+r(-0.1,0.1);

      [aspect*x2,r(0.0028,0.0032),r(2.8,3.0),r(0.45,0.55)],
      [aspect*x3,r(0.0022,0.0025),r(3.4,3.6),r(0.45,0.55)],
      [aspect*r(0.86,0.94),r(0.0033,0.0037),3.2,0.5],
      [aspect*r(0.06,0.14),r(0.0020,0.0023),3.7,0.5]
    ];

    gl.uniform4fv(loc.uF,arr); gl.uniform1i(loc.uN,P.length); gl.uniform1f(loc.uSeed,r(0,100));

    begin();
    var t0=0, DUR=7.6;
    function frame(now){
      if(!t0) t0=now;
      var t=(now-t0)/1000;
      gl.uniform2f(loc.uRes,cv.width,cv.height); gl.uniform1f(loc.uT,t);
      gl.clearColor(0,0,0,0); gl.clear(gl.COLOR_BUFFER_BIT); gl.drawArrays(gl.TRIANGLES,0,3);
      if(t<DUR) requestAnimationFrame(frame);
    }
    setTimeout(function(){ requestAnimationFrame(frame); }, 900);
    finish(900+5600);
    return true;
  }

  /* WebGL 을 못 쓰는 기기: 잉크 없이 바로 스페셜 지면으로 */
  function skip(){ try{ localStorage.setItem(KEY,"1"); }catch(e){} location.href=DEST; }

  function start(){ if(!startGL()) skip(); }

  // 지면이 실제로 올라가 있을 때만 (발행 전·실패 시 랜딩 그대로)
  fetch(DEST,{method:"HEAD",cache:"no-store"}).then(function(res){ if(res.ok) start(); }).catch(function(){});
})();
</script>
