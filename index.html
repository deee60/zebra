<head>

<title>지브라 베타 · 음악 큐레이션</title>

<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png">

<meta name="theme-color" content="#EFECE4">

<meta property="og:title" content="지브라 베타 · 음악 큐레이션">
<meta property="og:description" content="일상을 함께합니다.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://zebrabeta.kr/">
<meta property="og:image" content="https://zebrabeta.kr/zebra-og.png">

<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@300;400;500&family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,500&display=swap');
  *{box-sizing:border-box;margin:0;padding:0}
  :root{
    --bg:#efece4;
    --paper:#f7f5ef;
    --ink:#2b2a26;
    --soft:#8b877c;
    --gold:#b89a5a;
    --line:#ddd8cc;
  }
  body{
    font-family:'Noto Serif KR',serif;background:var(--bg);color:var(--ink);
    -webkit-font-smoothing:antialiased;
    display:flex;flex-direction:column;align-items:center;
    padding:0 24px 72px;text-align:center;
  }
  .wrap{max-width:520px;width:100%;display:flex;flex-direction:column;align-items:center}
  .hero{
    min-height:calc(100vh - 90px);width:100%;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:0 0 36px;
  }

  .logo{
    width:190px;height:190px;margin-bottom:52px;
    animation:fadeUp 1s ease both;
  }
  .logo img{width:100%;height:100%;object-fit:contain;display:block}

  .kicker{
    font-family:'Cormorant Garamond',serif;letter-spacing:.52em;text-transform:uppercase;
    font-size:13px;color:var(--gold);margin-bottom:92px;padding-left:.52em;
    animation:fadeUp 1s ease .15s both;
  }


  h1{
    font-weight:300;font-size:20px;line-height:2.1;letter-spacing:.02em;color:var(--ink);
    margin-bottom:30px;animation:fadeUp 1s ease .3s both;
  }
  h1 b{font-weight:500}

  .social{display:flex;gap:30px;margin-bottom:48px;animation:fadeUp 1s ease .45s both}

  .latest{margin-bottom:0;animation:fadeUp 1s ease .55s both;text-align:center}
  .latest .pick{
    display:inline-block;border:0.5px solid rgba(184,154,90,.7);color:#8a7440;border-radius:2px;
    padding:6px 19px;font-size:12px;letter-spacing:.04em;text-decoration:none;
    transition:background .25s,color .25s;
  }
  .latest .pick:hover{background:var(--gold);color:var(--paper)}
  .recent-row{
    margin-top:100px;margin-bottom:0;display:flex;align-items:center;justify-content:center;
    gap:22px;flex-wrap:wrap;animation:fadeUp 1s ease .1s both;
  }
  .recent{
    font-family:'Cormorant Garamond',serif;
    color:var(--soft);font-size:12px;letter-spacing:.14em;text-decoration:none;
    transition:color .25s;
  }
  .recent:hover{color:var(--gold)}
  .latest .dot{
    font-family:'Cormorant Garamond',serif;color:var(--soft);font-size:11px;
  }

  .divider{
    width:9px;height:0;border-bottom:1px solid #cdc7b8;
    margin:43px auto 85px;animation:fadeUp 1s ease .55s both;
  }
  .social a{
    font-family:'Cormorant Garamond',serif;letter-spacing:.16em;text-transform:uppercase;font-size:12px;
    color:var(--soft);text-decoration:none;transition:color .2s;padding-bottom:3px;border-bottom:1px solid transparent;
  }
  .social a:hover{color:var(--ink);border-bottom-color:var(--gold)}

  .notify{
    width:100%;max-width:340px;margin-bottom:40px;animation:fadeUp 1s ease .6s both;
  }
  .notify .lbl{font-size:13px;color:var(--soft);margin-bottom:12px;letter-spacing:.02em}
  .form{display:flex;gap:8px}
  .form input[type=email]{
    flex:1;font-family:'Cormorant Garamond','Noto Serif KR',serif;font-size:12px;letter-spacing:.02em;color:var(--ink);
    background:var(--paper);border:1px solid var(--line);border-radius:2px;
    padding:8px 16px;text-align:center;outline:none;transition:border-color .2s;width:100%;
  }
  .form input[type=email]:focus{border-color:var(--gold)}
  .form input[type=email]::placeholder{color:#b3aea2}
  .form button{
    font-family:'Cormorant Garamond',serif;letter-spacing:.1em;text-transform:uppercase;font-size:12px;
    background:var(--ink);color:var(--paper);border:none;border-radius:2px;
    padding:0 20px;cursor:pointer;transition:opacity .2s,transform .2s;white-space:nowrap;
  }
  .form button:hover{opacity:.85;transform:translateY(-1px)}

  .consent{
    display:flex;align-items:flex-start;justify-content:center;gap:7px;
    margin-top:16px;font-size:11px;color:#cbc6ba;line-height:1.6;
    text-align:left;cursor:pointer;
  }
  .consent input{
    margin-top:2px;flex-shrink:0;cursor:pointer;
    -webkit-appearance:none;appearance:none;
    width:13px;height:13px;border:1px solid var(--line);border-radius:2px;
    background:var(--paper);position:relative;transition:border-color .2s;
  }
  .consent input:checked{border-color:#cbc6ba}
  .consent input:checked::after{
    content:'';position:absolute;left:3.5px;top:1px;width:4px;height:7px;
    border:solid #b3aea2;border-width:0 1.5px 1.5px 0;transform:rotate(45deg);
  }
  .policy-btn{
    background:none;border:none;padding:0;margin-top:7px;cursor:pointer;
    font-family:'Cormorant Garamond',serif;font-size:11px;letter-spacing:.06em;
    color:#d5d0c4;text-decoration:underline;text-underline-offset:3px;
    text-decoration-color:#d5d0c4;text-decoration-thickness:0.5px;
  }
  .policy-btn:hover{color:var(--ink)}
  .policy-text{
    font-size:12px;color:var(--soft);line-height:1.9;text-align:left;
    margin-top:12px;padding:14px 16px;
    background:var(--paper);border:1px solid var(--line);border-radius:2px;
  }
  .msg{font-size:13px;color:var(--gold);margin-top:18px;min-height:24px;line-height:1.7;font-family:'Cormorant Garamond',serif;font-style:italic;letter-spacing:.02em}

  footer{
    font-family:'Cormorant Garamond',serif;font-style:italic;
    color:var(--soft);font-size:13px;letter-spacing:.1em;animation:fadeUp 1s ease .75s both;
  }

  @keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}

  .scroll-hint{
    position:fixed;left:50%;bottom:20px;transform:translateX(-50%);
    z-index:20;opacity:0;pointer-events:none;
    animation:hintIn 1.2s ease 1.8s forwards;transition:opacity .5s ease;
  }
  .scroll-hint .chev{
    display:block;width:12px;height:12px;
    border-right:1px solid #bcb6a6;border-bottom:1px solid #bcb6a6;
    transform:rotate(45deg);animation:hintBob 2.2s ease-in-out infinite;
  }
  .scroll-hint.hidden{opacity:0 !important}
  @keyframes hintIn{to{opacity:.55}}
  @keyframes hintBob{
    0%,100%{transform:rotate(45deg) translate(0,0)}
    50%{transform:rotate(45deg) translate(2px,2px)}
  }

  @media(max-width:480px){
    .logo{width:152px;height:152px;margin-bottom:32px}
    .hero{padding:18px 0;justify-content:flex-start}
    .recent-row{margin-top:50px;margin-bottom:52px}
    .kicker{margin-bottom:68px}
    .divider{margin-top:3.3px}
    .recent{font-size:11px}
    .misc{display:none}
    h1{font-size:17px}
    .form button{padding:0 16px}
  }

  .cta-note{font-size:13px;color:var(--soft);margin-bottom:12px;letter-spacing:.02em}
  .cta-main{margin-bottom:46px}
  .cta-main a{
    display:inline-block;background:var(--ink);color:var(--paper);border-radius:2px;
    padding:7px 22px;font-size:12px;letter-spacing:.06em;text-decoration:none;
    transition:opacity .2s,transform .2s;
  }
  .cta-main a:hover{opacity:.85;transform:translateY(-1px)}
  .notify .lbl{margin-bottom:12px;margin-top:14px;font-size:13px;color:var(--soft);display:flex;align-items:baseline;justify-content:center;gap:0}
  .notify .lbl .v10{font-size:12px;margin-right:2px}
  .form button.ghost{
    background:var(--paper);color:var(--soft);border:1px solid var(--line);
  }
  .form button.ghost:hover{color:var(--ink);border-color:var(--gold);opacity:1;transform:none}
</style>
</head>
<body>
  <div class="wrap">
    <div class="recent-row">
      <a class="recent" href="issue/vol38/">최근 발행물 보기</a>
      <a class="recent" href="everyone/">모두의 큐레이션</a>
      <a class="recent" href="taste/">취향의 발견<span class="misc"> (미셀러니)</span></a>
    </div>

    <div class="hero">
    <div class="logo"><img src="zebra-logo.png" alt="ZEBRA BETA"></div>

    <div class="kicker">Zebra Beta</div>

    <h1>당신의 하루에<br>함께 머물 수 있는 순간을 담습니다.</h1>


    <div class="social">
      <a href="https://instagram.com/zebrabeta26" target="_blank" rel="noopener">Instagram</a>
      <a href="https://brunch.co.kr/@zebrabeta" target="_blank" rel="noopener">Brunch</a>
    </div>

    <div class="latest">
      <a class="pick" href="curator/ilpostino/">큐레이터 추천</a>
    </div>
    </div>

    <div class="divider" aria-hidden="true"></div>

    <div class="notify">
      <div class="cta-note">지금 함께 하고 싶어요</div>
      <div class="cta-main"><a href="https://docs.google.com/forms/d/17WrrQ1Z_4hKa-RkaZa5csEyJKrP-257UTAvm8od-TBM/viewform" target="_blank" rel="noopener">참여 신청</a></div>

      <div class="lbl"><span class="v10">V1.0</span>이 오픈하면 알려주세요</div>

      <form class="form" id="stbForm" method="POST" accept-charset="utf-8" target="stb_sink"
            action="https://stibee.com/api/v1.0/lists/53IjfGo-upQA18qA7V7HdsyCu3PIFw==/public/subscribers">
        <input type="email" id="email" name="email" placeholder="이메일 주소" autocomplete="email">
        <button type="submit" id="btn" class="ghost">알림 받기</button>
      </form>

      <label class="consent">
        <input type="checkbox" id="agree">
        <span>(필수) 개인정보 수집 및 이용에 동의합니다.</span>
      </label>
      <button type="button" class="policy-btn" id="policyBtn">내용 보기</button>
      <div class="policy-text" id="policyText" hidden>뉴스레터 발송을 위한 최소한의 개인정보(이메일 주소)를 수집하고 이용합니다. 수집된 정보는 발송 외 다른 목적으로 이용되지 않으며, 서비스가 종료되거나 구독을 해지할 경우 즉시 파기됩니다.</div>

      <div class="msg" id="msg"></div>
    </div>

    <footer>zebra beta movement 2.</footer>
  </div>

  <iframe name="stb_sink" title="subscribe" style="display:none" aria-hidden="true"></iframe>

  <div class="scroll-hint" id="scrollHint" aria-hidden="true"><span class="chev"></span></div>

<script>
  var f=document.getElementById('stbForm'),
      email=document.getElementById('email'),
      agree=document.getElementById('agree'),
      msg=document.getElementById('msg'),
      pBtn=document.getElementById('policyBtn'),
      pText=document.getElementById('policyText');

  pBtn.addEventListener('click',function(){
    var open=!pText.hidden;
    pText.hidden=open;
    pBtn.textContent=open?'내용 보기':'닫기';
  });

  var hint=document.getElementById('scrollHint');
  if(hint){
    window.addEventListener('scroll',function(){
      if(window.scrollY>40) hint.classList.add('hidden');
      else hint.classList.remove('hidden');
    },{passive:true});
  }

  f.addEventListener('submit',function(e){
    var v=email.value.trim();
    if(!v||!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v)){
      e.preventDefault();
      msg.textContent='올바른 이메일 주소를 입력해주세요.';
      return;
    }
    if(!agree.checked){
      e.preventDefault();
      msg.textContent='개인정보 수집 및 이용에 동의해주세요.';
      return;
    }
    msg.textContent='감사합니다. V1.0이 오픈하면 알려드리겠습니다.';
    setTimeout(function(){ email.value=''; agree.checked=false; },300);
  });
</script>
</body>
</html>
