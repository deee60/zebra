name: build_bside

# bside/bside.json 이 커밋되면:
#   1) build_bside.py        → bside/index.html(피드) + bside/<slug>/index.html(세부페이지)
#   2) build_taste_everyone.py → sitemap.xml 갱신(세부페이지 주소 포함)
# 사람은 bside.json 만 건드린다. 나머지는 자동.

on:
  push:
    paths:
      - "bside/bside.json"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    if: github.actor != 'zebra-bot'          # 봇 커밋 무한루프 방지
    steps:
      - uses: actions/checkout@v4

      - name: Render feed + detail pages
        run: python3 _build_bside/build_bside.py

      - name: Rebuild sitemap
        run: python3 _build_taste_everyone/build_taste_everyone.py

      - name: Commit
        run: |
          git add bside sitemap.xml
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git config user.name  "zebra-bot"
            git config user.email "bot@zebrabeta.kr"
            git commit -m "auto: build bside [skip build]"
            git push
          fi
