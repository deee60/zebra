name: build_bside

# bside/bside.json 이 커밋되면 build_bside.py 로 bside/index.html 을 다시 그린다.
# 최신 주는 펼쳐진 채 맨 위, 지난 주는 접혀서 아래로(날짜 클릭 시 펼침).
# 항목 내용은 bside.json 에서만 온다. 사람은 bside.json 만 건드리고 index.html 은 자동.

on:
  push:
    paths:
      - "bside/bside.json"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    if: github.actor != 'zebra-bot'          # 봇 커밋 무한루프 방지
    steps:
      - uses: actions/checkout@v4

      - name: Render bside/index.html
        run: python3 _build_bside/build_bside.py

      - name: Commit
        run: |
          if [ -n "$(git status --porcelain bside/index.html)" ]; then
            git config user.name  "zebra-bot"
            git config user.email "bot@zebrabeta.kr"
            git add bside/index.html
            git commit -m "auto: build bside [skip build]"
            git push
          else
            echo "no changes"
          fi
