<style>
  :root{--bg:#eeece7;--sleeve:#e3ddd0;--ink:#2b2a26;--mute:#6f6b61;--soft:#8b877c;--faint:#a39d8f;--gold:#b89a5a;--wine:#8a6d32;--vinyl:#1c1b18}
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Noto Serif KR',serif;-webkit-font-smoothing:antialiased}
  body{min-height:100vh;display:flex;justify-content:center;overflow-x:hidden}
  .page{width:356px;max-width:calc(100vw - 24px);padding:40px 0 22px;display:flex;flex-direction:column;min-height:100vh;min-height:100dvh}
  .kicker{margin:0 0 6px;align-self:flex-end;font-size:12px;letter-spacing:.32em;margin-right:-.32em;color:var(--soft);transition:transform 1.4s cubic-bezier(.22,.7,.2,1)}
  .stage{position:relative;width:100%;height:260px;transition:height 1.2s ease,margin-bottom 1.2s ease}
  .ease{transition:transform 1.4s cubic-bezier(.22,.7,.2,1),opacity 1s ease}

  /* record */
  .record{position:absolute;left:0;top:10px;width:240px;height:240px;z-index:1}
  .disc{width:240px;height:240px}
  .spin{animation:spin 6s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .label{position:absolute;left:86px;top:86px;width:68px;height:68px;border-radius:50%;overflow:hidden;pointer-events:none;color:var(--wine);text-shadow:0 .6px 0 #fff}
  .label .big{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:'Pinyon Script',cursive;font-size:66px;line-height:1;padding-top:4px;opacity:.85}

  /* sleeve */
  .sleeve{position:absolute;left:0;top:0;width:260px;height:260px;z-index:2;background:var(--jk-bg,var(--sleeve));color:var(--jk-ink,var(--ink));box-shadow:0 1px 0 rgba(43,42,38,.05),0 12px 28px rgba(43,42,38,.16);transition:transform 1.4s cubic-bezier(.22,.7,.2,1),width 1.2s ease,height 1.2s ease,background-color 2.7s ease}
  /* 면마다 자켓 색: A 와인, B 회색 — 면을 바꾸면 디졸브로 넘어간다 */
  .sleeve[data-theme=wine]{--jk-bg:#4a2a27;--jk-ink:#f1e7da;--jk-accent:#d8b77a;--jk-soft:rgba(241,231,218,.66);--jk-faint:rgba(241,231,218,.45)}
  .sleeve[data-theme=grey]{--jk-bg:#6e6a64;--jk-ink:#f3eee4;--jk-accent:#e2c58e;--jk-soft:rgba(243,238,228,.7);--jk-faint:rgba(243,238,228,.5)}
  /* 재생해서 창으로 열리면 같은 색을 옅게 풀어 영상과 글씨를 편하게 */
  .sleeve.playing[data-theme=wine]{--jk-bg:#b9aba1;--jk-ink:#2b2a26;--jk-accent:#6b4636;--jk-soft:rgba(43,42,38,.62);--jk-faint:rgba(43,42,38,.42)}
  .sleeve.playing[data-theme=grey]{--jk-bg:#c2bcb2;--jk-ink:#2b2a26;--jk-accent:#7a6440;--jk-soft:rgba(43,42,38,.62);--jk-faint:rgba(43,42,38,.42)}
  .sleeve .btn{color:var(--jk-soft,var(--mute))}
  .sleeve .btn:hover{color:var(--jk-ink,var(--ink))}
  .sleeve .sidelabel{color:var(--jk-accent,var(--wine))}
  .sleeve .title .play{color:var(--jk-accent,var(--mute))}
  .sleeve .title .flip{color:var(--jk-faint,var(--faint))}
  .sleeve .info .a{color:var(--jk-soft,var(--mute))}
  .sleeve .credit{color:var(--jk-accent,var(--gold))}
  .sleeve .corner{color:var(--jk-soft,var(--mute))}
  .sleeve .spine{position:absolute;right:0;top:0;bottom:0;width:1px;background:rgba(43,42,38,.12)}
  .corner{position:absolute;right:18px;top:16px;font-size:10px;color:var(--mute);transition:opacity .6s ease}
  .title{position:absolute;left:18px;right:18px;top:0;bottom:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center;transition:opacity .8s ease;pointer-events:none}
  .title .name{font-size:11px;line-height:1.3;letter-spacing:.01em}
  .btn{border:none;background:transparent;cursor:pointer;color:var(--mute);font-family:'Noto Serif KR',serif;padding:0;transition:color .3s ease;-webkit-tap-highlight-color:transparent}
  .btn:hover{color:var(--ink)}
  .icon{width:44px;height:40px;display:flex;align-items:center;justify-content:center}
  .title .play{pointer-events:auto;position:relative;z-index:4;width:44px;height:36px}
  .sidelabel{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:13px;letter-spacing:.06em;color:var(--wine);margin-bottom:2px}
  .title .flip{pointer-events:auto;position:relative;z-index:4;min-height:32px;padding:0 10px;font-family:'Cormorant Garamond',serif;font-style:italic;font-size:12px;letter-spacing:.06em;color:var(--faint)}
  .title .flip:hover{color:var(--ink)}
  .playing .title .play,.playing .title .flip{pointer-events:none}
  .back{position:absolute;z-index:4;width:44px;height:32px;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity 1s ease .9s,color .3s ease}
  .playing .back{opacity:1;pointer-events:auto}
  .ghost{pointer-events:none !important;transition:opacity 2.7s ease,filter 2.7s ease !important}
  .ghost *{pointer-events:none !important}
  .opener{position:absolute;inset:0;border:none;background:transparent;cursor:pointer;z-index:3}
  .sides{display:none !important;position:absolute;right:14px;bottom:8px;z-index:4;display:flex;align-items:center;gap:4px;font-size:10px;color:var(--mute);transition:opacity .6s ease}
  .sides .btn{min-width:22px;min-height:26px;font-style:italic;font-size:12px;color:var(--faint)}
  .sides .btn[aria-selected="true"]{color:var(--wine)}
  .hint{animation:hint 2.4s ease-in-out 1.6s 1 both}
  @keyframes hint{0%,100%{color:var(--faint)}40%,60%{color:var(--wine)}}

  /* player inside the jacket */
  .screen{position:absolute;z-index:3;background:var(--vinyl);box-shadow:0 0 0 .5px rgba(43,42,38,.25);opacity:0;pointer-events:none;transition:opacity 1s ease .6s}
  .screen #yt,.screen iframe{width:100%;height:100%;display:block;border:0}
  .info{position:absolute;z-index:3;bottom:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:45px;gap:4px;opacity:0;pointer-events:none;transition:opacity 1s ease .9s;text-align:center}
  .info .t{font-size:14px}
  .info .a{font-size:11px;color:var(--mute)}
  .credit{position:absolute;z-index:3;font-family:'Cormorant Garamond',serif;font-size:10.5px;letter-spacing:.12em;font-style:italic;font-size:12px;color:var(--gold);white-space:nowrap;opacity:0;pointer-events:none;transition:opacity 1s ease .9s}
  .playing .credit{opacity:1}
  .row{margin-top:10px;display:flex;align-items:center;gap:6px}
  .row .side{min-height:40px;font-style:italic;font-size:11px}
  .row .side.l{margin-right:10px}.row .side.r{margin-left:10px}
  .playing .screen,.playing .info{opacity:1;pointer-events:auto}

  footer{margin-top:auto;padding-top:22px;display:flex;flex-direction:column;align-items:center;gap:6px}
  .home{min-height:32px;display:flex;align-items:center;font-family:'Cormorant Garamond',serif;font-size:12px;letter-spacing:.14em;color:var(--soft);text-decoration:none;transition:color .25s}
  .home:hover{color:var(--gold)}
  .colophon{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:13px;letter-spacing:.1em;color:var(--soft)}
  @media (prefers-reduced-motion:reduce){.ease,.sleeve,.stage{transition:none}.spin{animation:none}}
  /* 배경: 랜딩과 같은 서리 숲(아이보리)과 흰 눈 */
  html{background:var(--bg)}
  html body{background:transparent}
  body::before{content:'';position:fixed;left:0;right:0;top:0;height:100vh;z-index:-1;pointer-events:none;
    background:url(/frost-winter-v3.jpg) center top/cover no-repeat;
    -webkit-mask-image:linear-gradient(#000 0%,#000 40%,transparent 88%);mask-image:linear-gradient(#000 0%,#000 40%,transparent 88%)}
  #snow{position:fixed;inset:0;width:100%;height:100%;z-index:-1;pointer-events:none}
  body.tight .page{padding-top:18px;padding-bottom:12px}
  body.tight .kicker{margin-bottom:4px}
  body.tight footer{padding-top:14px}
</style>

<canvas id="snow" aria-hidden="true"></canvas>
<script>
  /* 흰 눈: 스텔라장 「나의 겨울 여행」처럼 — 작고 또렷한 눈송이와 크고 흐린 눈송이(초점 밖)가 섞여 천천히 */
  (function(){
    if (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    var c=document.getElementById('snow'), x=c.getContext('2d'), W, H, dpr=Math.min(2, window.devicePixelRatio||1), flakes=[];
    function size(){ W=c.clientWidth||innerWidth; H=c.clientHeight||innerHeight; c.width=W*dpr; c.height=H*dpr; x.setTransform(dpr,0,0,dpr,0,0); }
    var t0 = Date.now();
    function mk(top){
      var big = top && (Date.now() - t0 > 4000) && Math.random() < .14, r = big ? 5+Math.random()*7 : 2+Math.random()*2.6;
      return { x:Math.random(), y: top ? -r*2 : Math.random()*H, r:r, big:big,
               v: big ? .35+Math.random()*.45 : .45+Math.random()*.7,   // 큰 송이는 가까워서 느리고 흐리다
               a: Math.random()*6.28, s: .003+Math.random()*.007, w: .25+Math.random()*.5,
               o: big ? .38+Math.random()*.25 : .85+Math.random()*.15 };
    }
    function draw(f){
      var px = f.x*W; var g = x.createRadialGradient(px, f.y, 0, px, f.y, f.r);
      if (f.big){ g.addColorStop(0,'rgba(255,255,255,'+f.o+')'); g.addColorStop(.55,'rgba(255,255,255,'+(f.o*.7)+')'); g.addColorStop(1,'rgba(255,255,255,0)'); }
      else { g.addColorStop(0,'rgba(255,255,255,'+f.o+')'); g.addColorStop(.35,'rgba(255,255,255,'+(f.o*.75)+')'); g.addColorStop(1,'rgba(255,255,255,0)'); }
      x.shadowColor = f.big ? 'rgba(110,100,85,.18)' : 'rgba(100,90,75,.32)'; x.shadowBlur = f.big ? 10 : 6;
      x.beginPath(); x.arc(px, f.y, f.r, 0, 6.283); x.fillStyle = g; x.fill();
    }
    size(); var n = W < 600 ? 34 : 60; for (var i=0;i<n;i++) flakes.push(mk(false));
    addEventListener('resize', size);
    (function tick(){
      if (c.clientWidth && (Math.abs(c.clientWidth-W)>2 || Math.abs(c.clientHeight-H)>2)) size();
      x.clearRect(0,0,W,H);
      for (var i=0;i<flakes.length;i++){
        var f=flakes[i]; f.y+=f.v; f.a+=f.s; f.x+=Math.sin(f.a)*f.w/(W||1000);
        if (f.y>H+f.r*2){ flakes[i]=mk(true); continue; }
        draw(f);
      }
      requestAnimationFrame(tick);
    })();
  })();
</script>

(function(){

  var SIDES = [
    { side:'A', name:'발라디즘 · 겨울', corner:'', theme:'wine', songs:[
      { title:'나의 겨울 여행', artist:'스텔라장', yt:'PPS0mI6BOU4' },
      { title:'Melody', artist:'안전지대', yt:'3eqPoV1lJa4' },

  /* 모두의 큐레이션에 발행되면 B면에 저절로 올라간다 (사이트 안에서만 동작) */
  try {

      if (!Array.isArray(list)) return;

        .map(function(x){ return { title:x.title, artist:x.artist, by:x.by, yt:x.youtube }; });
      if (songs.length) { SIDES[1].songs = songs; if (st.s === 1) renderInfo(); }
    }).catch(function(){});
  } catch(e){}

  /* ── 상태 ─────────────────────────────── */
  var st = { opened:false, out:false, started:false, playing:false, s:0, cur:0, hinted:false };
  var $ = function(id){ return document.getElementById(id); };
  var stage=$('stage'), record=$('record'), disc=$('disc'), sleeve=$('sleeve'), title=$('title'), corner=$('corner');
  var sidesEl=$('sides'), screen=$('screen'), info=$('info'), opener=$('opener');
  var t1, t2, player=null, ytReady=false, pending=null;

  function contentW(){ return stage.getBoundingClientRect().width; }

  /* 레이아웃: 앨범(260) ↔ 재생(화면 폭 정사각) */
  function fitPage(){ var pg=document.querySelector('.page'); if(pg) pg.style.minHeight = window.innerHeight+'px'; }
  function layout(){
    fitPage();
    var W = contentW();
    var jr;
    if (st.started) {
      var vw = document.documentElement.clientWidth;
      var J = Math.min(vw, 560);                       // 자켓 한 변
      var left = (W - J) / 2;                           // 내용 폭 밖으로 넓힌다
      var small = J < 480;                              // 휴대폰: 여백을 줄여 HOME까지 한 화면에
      var m = small ? 16 : Math.max(12, Math.min(32, (J - 356) / 2 + 32)); // 영상 둘레 종이 여백
      var band = small ? 26 : 32;                       // 영상 위 띠(뒤로 화살표·추천인 자리)
      var ew = J - m*2, eh = Math.max(200, Math.round(ew * 9 / 16));
      screen.style.left = m+'px'; screen.style.top = (m+band)+'px'; screen.style.width = ew+'px'; screen.style.height = eh+'px';
      info.style.left = m+'px'; info.style.right = m+'px'; info.style.top = (m+band+eh)+'px'; info.style.bottom = 'auto';
      // 좁은 화면에서는 곡 정보·버튼이 자켓 밖으로 넘치지 않게 자켓을 그만큼 늘린다
      // 휴대폰: 재생 중엔 위 여백을 줄이고, 그래도 넘치면 영상-곡 정보 간격(45px)을 필요한 만큼만 줄여 HOME까지 한 화면에
      document.body.classList.toggle('tight', small);
      info.style.paddingTop = '';
      var H = Math.max(J, m + band + eh + info.offsetHeight + (small ? 18 : Math.max(m, 24)));
      if (small) {
        var foot = document.querySelector('footer');
        var avail = window.innerHeight - stage.getBoundingClientRect().top - window.scrollY - foot.offsetHeight - 18 - 12;
        if (H > avail) {
          var pad = Math.max(14, 45 - (H - avail));
          info.style.paddingTop = pad + 'px';
          H = Math.max(J, m + band + eh + info.offsetHeight + 18);
        }
      }
      sleeve.style.width = J+'px'; sleeve.style.height = H+'px';
      sleeve.style.transform = 'translateX('+left+'px)';
      stage.style.height = H+'px'; stage.style.marginBottom = '18px';
      var cr=$('songBy'); cr.style.right = m+'px'; cr.style.top = (m+Math.round((band-12)/2))+'px';
      var bk=$('backBtn'); bk.style.left = (m-14)+'px'; bk.style.top = Math.max(0, Math.round((m+band-32)/2))+'px';
      jr = Math.min(left + J, W + (vw - W) / 2 - 16);   // 화면 끝에 붙어 잘리지 않게
    } else {
      sleeve.style.width = '260px'; sleeve.style.height = '260px';
      document.body.classList.remove('tight'); info.style.paddingTop = '';
      var gutter = (document.documentElement.clientWidth - W) / 2;
      sleeve.style.transform = 'translateX(' + (st.opened ? -Math.min(24, gutter) : (W-260)/2) + 'px)';
      stage.style.height = '260px'; stage.style.marginBottom = '0px';
      jr = (st.opened ? -Math.min(24, gutter) : (W-260)/2) + 260;
    }
    document.querySelector('.kicker').style.transform = 'translateX('+(jr - W)+'px)';
    var rx = st.opened && st.out && !st.started ? 118 : (st.opened ? 40 : (W-260)/2 + 48);
    record.style.transform = 'translateX('+rx+'px)';
  }

  function renderSides(){
    sidesEl.innerHTML = 'Side';
    SIDES.forEach(function(sd, i){
      var b = document.createElement('button');
      b.type='button'; b.className='btn'; b.setAttribute('role','tab');
      b.setAttribute('aria-selected', i===st.s ? 'true':'false');
      b.setAttribute('aria-label', sd.side+'면 '+sd.name);
      b.textContent = sd.side;
      if (i===1 && st.s!==1 && st.out && !st.hinted) b.classList.add('hint');
      b.onclick = function(){ if (i!==st.s) swapTo(i); };
      sidesEl.appendChild(b);
    });
  }

  function renderSide(){
    var sd = SIDES[st.s];
    $('sideName').textContent = sd.name;
    $('labelLetter').textContent = sd.side;
    $('sideLabel').textContent = 'Side '+sd.side;
    sleeve.setAttribute('data-theme', sd.theme || '');
    var o = SIDES[(st.s+1)%SIDES.length];
    $('flipBtn').textContent = 'Side '+o.side; $('flipBtn').setAttribute('aria-label', o.side+'면 '+o.name+'으로 바꾸기');
    corner.textContent = sd.corner;
    $('playBtn').setAttribute('aria-label', sd.name+' 재생');
    var n = SIDES[(st.s+1)%SIDES.length], p = SIDES[(st.s-1+SIDES.length)%SIDES.length];
    $('nextSide').textContent = 'Side '+n.side+' →'; $('nextSide').setAttribute('aria-label','다음 면, '+n.side+'면 '+n.name);
    $('prevSide').textContent = '← Side '+p.side; $('prevSide').style.visibility = SIDES.length > 2 ? '' : 'hidden'; $('prevSide').setAttribute('aria-label','이전 면, '+p.side+'면 '+p.name);
    renderSides(); renderInfo();
  }

  function renderInfo(){
    var song = SIDES[st.s].songs[st.cur % SIDES[st.s].songs.length];
    $('songTitle').textContent = song.title;
    $('songArtist').textContent = song.artist;
    $('songBy').textContent = song.by ? 'curated by '+song.by : '';
    $('toggleBtn').innerHTML = st.playing
      ? '<svg aria-hidden="true" width="9" height="11" viewBox="0 0 9 11"><path d="M1.5 1 V10 M7.5 1 V10" stroke="currentColor" stroke-width="1.1" fill="none"/></svg>'
      : '<svg aria-hidden="true" width="9" height="11" viewBox="0 0 9 11"><path d="M1 1 L8.5 5.5 L1 10 Z" stroke="currentColor" stroke-width="1" stroke-linejoin="round" fill="none"/></svg>';
    $('toggleBtn').setAttribute('aria-label', st.playing ? '일시정지' : '재생');
    disc.classList.toggle('spin', st.playing);
    if (st.started) layout();
  }

  function render(){
    title.style.opacity = st.started ? 0 : 1;
    corner.style.opacity = st.started ? 0 : 1;
    var showSel = st.opened && !st.started;
    sidesEl.style.opacity = showSel ? 1 : 0; sidesEl.style.pointerEvents = showSel ? 'auto' : 'none';
    opener.style.display = st.opened ? 'none' : 'block';
    sleeve.classList.toggle('playing', st.started);
    layout(); renderSide();
  }

  function open(){
    if (st.opened) return;
    st.opened = true; render();
    clearTimeout(t2); t2 = setTimeout(function(){ st.out = true; render(); }, 700);
  }

  /* 자켓 글씨를 디졸브로 바꾼다: 옛 글씨는 흐려지며 사라지고 새 글씨가 떠오른다 */
  function dissolve(change){
    var olds = [title, corner].map(function(el){
      var g = el.cloneNode(true);
      g.removeAttribute('id'); g.querySelectorAll('[id]').forEach(function(n){ n.removeAttribute('id'); });
      g.classList.add('ghost'); g.style.opacity = getComputedStyle(el).opacity;
      el.parentNode.insertBefore(g, el);
      return g;
    });
    [title, corner].forEach(function(el){ el.style.transition = 'none'; el.style.opacity = 0; el.style.filter = 'blur(3px)'; });
    change();
    [title, corner].forEach(function(el){ el.style.opacity = 0; void el.offsetWidth; el.style.transition = 'opacity 1.8s ease .3s, filter 1.6s ease .3s'; el.style.opacity = 1; el.style.filter = 'blur(0)'; });
    requestAnimationFrame(function(){ olds.forEach(function(g){ g.style.opacity = 0; g.style.filter = 'blur(3px)'; }); });
    setTimeout(function(){ olds.forEach(function(g){ g.remove(); }); [title, corner].forEach(function(el){ el.style.transition = ''; el.style.filter = ''; }); }, 4000);
  }

  function swapTo(i){
    st.out = false; st.hinted = true; render();
    clearTimeout(t1);
    setTimeout(function(){ dissolve(function(){ st.s = i; st.cur = 0; render(); }); }, 350);
    t1 = setTimeout(function(){ st.out = true; render(); }, 900);
  }

  /* ── YouTube ─────────────────────────────── */
  function loadYT(){
    if (window.YT && window.YT.Player) { ytReady = true; return; }
    var tag = document.createElement('script'); tag.src = 'https://www.youtube.com/iframe_api';
    document.head.appendChild(tag);
  }
  window.onYouTubeIframeAPIReady = function(){
    ytReady = true;
    if (pending) { var p = pending; pending = null; p(); }
  };
  function cue(){
    var song = SIDES[st.s].songs[st.cur % SIDES[st.s].songs.length];
    if (!player) {
      player = new YT.Player('yt', {
        videoId: song.yt,
        playerVars: { autoplay:1, playsinline:1, rel:0, modestbranding:1 },
        events: {
          onReady: function(e){ e.target.playVideo(); },
          onStateChange: function(e){
            if (e.data === YT.PlayerState.ENDED) { next(); }              // 면 안에서 계속 흐른다
            else if (e.data === YT.PlayerState.PLAYING) { st.playing = true; renderInfo(); }
            else if (e.data === YT.PlayerState.PAUSED) { st.playing = false; renderInfo(); }
          },
          onError: function(){ next(); }                                    // 재생 안 되는 곡은 건너뛴다
        }
      });
    } else {
      player.loadVideoById(song.yt);
    }
    renderInfo();
  }
  function withYT(fn){ if (ytReady) fn(); else { pending = fn; loadYT(); } }

  function start(){
    if (!st.opened) { st.opened = true; }
    st.started = true; st.out = false; st.playing = true; render();
    withYT(cue);
  }
  function next(){ st.cur = (st.cur + 1) % SIDES[st.s].songs.length; st.playing = true; withYT(cue); }
  function prev(){ st.cur = (st.cur - 1 + SIDES[st.s].songs.length) % SIDES[st.s].songs.length; st.playing = true; withYT(cue); }
  function goSide(d){ st.s = (st.s + d + SIDES.length) % SIDES.length; st.cur = 0; st.playing = true; renderSide(); withYT(cue); }

  $('playBtn').onclick = function(e){ e.stopPropagation(); start(); };
  opener.onclick = open;
  $('flipBtn').onclick = function(e){
    e.stopPropagation();
    var i = (st.s+1) % SIDES.length;
    if (st.opened) { swapTo(i); return; }
    dissolve(function(){ st.s = i; st.cur = 0; render(); });
  };
  $('backBtn').onclick = function(){
    if (player && player.pauseVideo) player.pauseVideo();
    st.started = false; st.playing = false; st.opened = false; st.out = false;
    render();
  };
  $('nextBtn').onclick = next;
  $('prevBtn').onclick = prev;
  $('nextSide').onclick = function(){ goSide(1); };
  $('prevSide').onclick = function(){ goSide(-1); };
  $('toggleBtn').onclick = function(){
    if (!player) return;
    if (st.playing) { player.pauseVideo(); st.playing = false; } else { player.playVideo(); st.playing = true; }
    renderInfo();
  };
  window.addEventListener('resize', layout);

  loadYT();
  render();
  window.addEventListener('load', layout);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(layout);
})();
</script>
</body>
</html>
