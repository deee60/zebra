<title>할로윈 스페셜 · 나는 널 몰라 | Zebra Beta</title>
<meta name="description" content="1994년 MBC 미니시리즈 《M》의 주제가, 최윤실 〈나는 널 몰라〉. zebra beta movement 2.">
<meta name="theme-color" content="#1c1b18">
<meta property="og:title" content="나는 널 몰라 — 최윤실 · 할로윈 스페셜">
<meta property="og:description" content="당신의 얼굴이 낯설어지는 밤. zebra beta movement 2.">

<style>
  /* 밤판: 지브라 크림 지면을 뒤집은 할로윈 스페셜 */
  :root{
    --night:#1c1b18; --fg:#ece7db; --body:#cfc9ba; --soft:#9a9486; --faint:#8a8578;
    --gold:#c9b98f; --line:#3a3730; --line2:#2e2c27; --label:#a8352a;
    --chip-ink:#6f6a5e; --chip-paper:#1c1b18;
  }
  *{ margin:0; padding:0; box-sizing:border-box; }
  html{ -webkit-text-size-adjust:100%; background:var(--night); }
  body{ background:var(--night); color:var(--body); font-family:"Noto Serif KR", serif; }
  a{ color:inherit; }
  :focus-visible{ outline:2px solid var(--gold); outline-offset:3px; }
  .sheet{ max-width:680px; margin:0 auto; padding:56px 20px 72px; display:flex; flex-direction:column; min-height:100dvh;
          animation:settle 1.2s ease both; }
  @keyframes settle{ from{opacity:0;} to{opacity:1;} }

  .notice{ text-align:center; font-size:11px; letter-spacing:.13em; line-height:1.95; color:var(--faint); word-break:keep-all; margin-bottom:28px; }
  .top{ display:flex; justify-content:space-between; align-items:baseline; flex-wrap:wrap; gap:12px; }
  .top .ser{ font-family:"Cormorant Garamond", serif; font-style:italic; font-size:17px; color:var(--soft); }
  .tag{ font-family:"Cormorant Garamond", serif; font-size:11px; letter-spacing:.22em; color:#f3ece0; background:var(--label); padding:5px 10px 4px; }

  .film{ display:block; margin:40px 0 0;  position:relative; background:var(--fg); padding:14px 14px 40px; box-shadow:0 18px 40px rgba(0,0,0,.45); text-decoration:none; }
  .screen{ position:relative; aspect-ratio:16/9; max-width:100%; background:#0f0e0c; overflow:hidden; display:flex; align-items:center; justify-content:center; }
  .screen img{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
  .play{ position:relative; width:64px; height:64px; border-radius:50%; background:rgba(15,14,12,.6); display:flex; align-items:center; justify-content:center; transition:background .25s; }
  .film:hover .play, .film:focus-visible .play{ background:rgba(168,53,42,.85); }
  .veil{ position:absolute; inset:0; background:rgba(236,231,219,.92); display:flex; align-items:center; justify-content:center; transition:opacity .6s ease; }
  .veil span{ font-family:"Cormorant Garamond", serif; font-style:italic; font-size:120px; line-height:1; color:#6f6a5e; }
  .screen iframe{ position:absolute; inset:0; width:100%; height:100%; border:0; }
  .veil{ border:0; cursor:pointer; padding:0; font:inherit; }
  .film:hover .veil, .veil:focus-visible, .veil.gone{ opacity:0; pointer-events:none; }
  .cap{ position:absolute; left:14px; right:14px; bottom:12px; font-family:"Cormorant Garamond","Noto Serif KR",serif; font-style:italic; font-size:13px; color:#6f6a5e; display:flex; justify-content:space-between; gap:12px; }

  .head{ margin-top:56px; }
  h1{ font-weight:300; font-size:clamp(34px,7vw,46px); line-height:1.15; color:var(--fg); letter-spacing:-.01em; }
  .sub{ margin-top:12px; font-family:"Cormorant Garamond","Noto Serif KR",serif; font-style:italic; font-size:19px; color:#b9b2a3; }
  .rule{ width:28px; height:1px; background:#6f6a5e; margin:32px 0; }
  .lead{ margin-bottom:28px; text-align:right; font-weight:300; font-size:17px; line-height:1.9; color:var(--gold); }
  .note{ font-size:15.5px; line-height:2; font-weight:300; word-break:keep-all; }
  .note + .note{ margin-top:20px; }

  .credits{ margin-top:48px; padding-top:20px; border-top:1px solid var(--line); display:flex; flex-direction:column; gap:6px; font-size:13px; line-height:1.7; }
  .credits div{ display:flex; gap:16px; }
  .credits span:first-child{ width:104px; flex:0 0 auto; color:var(--soft); }
  .credits span:last-child{ color:#ddd7c9; font-size:14px; }

  .listen{ margin-top:36px; text-align:center; }
  .listen-row{ display:flex; justify-content:center; align-items:center; flex-wrap:wrap; column-gap:24px; row-gap:8px; }
  .listen-row + .listen-row{ margin-top:13px; }
  .listen-row svg{ width:13.5px; height:13.5px; flex:0 0 13.5px; }
  .listen-row .off{ position:relative; display:inline-flex; align-items:center; gap:6px; color:#5a564d; cursor:default; font-size:12px; font-weight:500; letter-spacing:.12em; padding:4px 0; }
  .listen-row .off.latin{ font-family:"Cormorant Garamond", serif; font-size:14px; letter-spacing:.08em; }
  .listen-row .off svg{ opacity:.5; }
  .listen-row .off::after{ content:attr(data-off); position:absolute; left:50%; transform:translate(-50%,-168%); white-space:nowrap; pointer-events:none;
    background:var(--fg); color:var(--night); font-family:"Noto Serif KR",serif; font-weight:400; font-size:10.5px; letter-spacing:.06em; padding:5px 9px; border-radius:2px; opacity:0; transition:opacity .2s; }
  .listen-row .off:hover::after{ opacity:.94; }
  .listen-note{ margin-top:14px; font-size:11.5px; color:var(--faint); letter-spacing:.04em; }

  .see{ margin-top:96px; }
  .see h2{ padding-bottom:14px; border-bottom:1px solid var(--line); font-weight:400; font-size:18px; color:var(--fg); }
  /* 영상창은 제목 줄을 빼고 소개 글(본문)의 세로 가운데에 맞춘다 */
  .rec{ display:grid; grid-template-columns:minmax(0,300px) minmax(0,1fr); column-gap:24px; row-gap:6px; align-items:start; padding:32px 0; border-bottom:1px solid var(--line2); }
  .mat{ grid-column:1; grid-row:4; align-self:center; width:100%; max-width:100%; background:var(--fg); padding:8px; box-shadow:0 12px 28px rgba(0,0,0,.4); }
  .frame{ position:relative; aspect-ratio:16/9; max-width:100%; background:#0f0e0c; }
  .frame iframe{ position:absolute; inset:0; width:100%; height:100%; border:0; }
  .txt{ display:contents; }
  .txt > *{ grid-column:2; min-width:0; }
  .txt .n{ grid-row:1; font-family:"Cormorant Garamond",serif; font-size:13px; color:var(--faint); }
  .txt .s{ grid-row:2; font-family:"Cormorant Garamond",serif; font-weight:500; font-size:24px; line-height:1.2; color:var(--fg); }
  .txt .a{ grid-row:3; font-family:"Cormorant Garamond",serif; font-style:italic; font-size:16px; color:#b9b2a3; }
  .txt p.hint{ grid-row:5; margin-top:4px; font-size:12px; line-height:1.7; color:var(--faint); }
  .txt p{ grid-row:4; align-self:center; margin:4px 0; font-size:14px; line-height:1.85; color:#bfb9aa; font-weight:300; word-break:keep-all; }

  .colophon{ margin-top:clamp(40px,7vh,64px); padding-bottom:16px; text-align:center; font-family:"Cormorant Garamond",serif; font-style:italic; font-size:12.5px; color:var(--faint); letter-spacing:.18em; text-indent:.18em; }
  .homenav{ margin-top:2px; padding-bottom:34px; text-align:center; }
  .homenav a{ font-family:"Cormorant Garamond",serif; font-size:12px; letter-spacing:.16em; text-indent:.16em; color:var(--soft); text-decoration:none; padding:10px 14px; display:inline-block; }
  .homenav a:hover{ color:var(--gold); }

  .spacer{ flex:1 1 auto; }
  .moved{ text-align:center; }
  .moved .rule{ width:30px; height:1px; background:var(--faint); margin:26px auto; border:0; }
  .moved .line{ font-size:15.5px; color:var(--body); letter-spacing:.05em; line-height:1.9; }
  .moved .sub{ margin-top:28px; font-size:12.5px; color:var(--faint); letter-spacing:.06em; line-height:2.2; word-break:keep-all; font-style:normal; font-family:"Noto Serif KR",serif; }
  .moved .home{ margin-top:44px; }
  .moved .home a{ display:inline-block; padding:9px 22px; border:1px solid var(--gold); color:var(--gold); text-decoration:none; font-size:12.5px; letter-spacing:.12em; transition:background .25s, color .25s; }
  .moved .home a:hover{ background:var(--gold); color:var(--night); }

  @media (max-width:640px){ .rec{ grid-template-columns:minmax(0,1fr); } .mat{ grid-column:1; grid-row:auto; margin-bottom:14px; } .txt > *{ grid-column:1; grid-row:auto; } }
  @media (prefers-reduced-motion: reduce){ .sheet{ animation:none; } .veil{ transition:none; } }

/* 복사 방지 — 드래그 선택 차단 */
html,body{ -webkit-user-select:none; -moz-user-select:none; -ms-user-select:none; user-select:none; -webkit-touch-callout:none; }
a,button,iframe,input,textarea{ -webkit-user-select:auto; user-select:auto; }
</style>
</head>
<body>
<!-- ZEBRA_EXPIRED_STUB -->
  <main class="sheet" id="sheet">
    <div class="spacer"></div>
    <div class="moved">
      <hr class="rule">
      <p class="line">이 큐레이션은<br>아카이브로 이관되었습니다</p>
      <p class="sub">지브라의 큐레이션은<br>발행 후 72시간 동안 열립니다.<br>이후 아카이브로 옮겨지며,<br>아카이브는 V1.0부터 회원에게 열립니다.</p>
      <p class="home"><a href="https://zebrabeta.kr/#home">지브라 베타</a></p>
    </div>
    <div class="spacer"></div>
    <p class="colophon">zebra beta · movement 2.</p>
  </main>
</body>
</html>
