<style>
:root{ --bg:#E4E1DA; --paper:#F5F3ED; --ink:#26221C; --mid:#6E6A61; --faint:#A9A297; --rule:#DFDAD0; }
*{ margin:0; padding:0; box-sizing:border-box; }
html{ -webkit-text-size-adjust:100%; }
body{ background:var(--bg); display:flex; justify-content:center;

.sheet{

.notice{

}

.plate{ margin-top:clamp(56px, 10vh, 96px); width:min(46%, 258px); }
.plate img{ width:100%; display:block; }

.titles{ text-align:center; margin-top:clamp(48px, 8vh, 76px); }
.titles .series{ font-size:14px; font-weight:500; color:var(--ink); letter-spacing:.1em; }
/* letterpress 인장 (본편 Vol. 전용 — stamp:true). series 자리에 같은 크기로.
   골드 금박 압인: 브랜드 골드를 종이에 눌러 각인. 위 어두운그림자(눌림)+아래 밝은골드하이라이트(가장자리 빛). */
.stamp{ display:flex; flex-direction:column; align-items:center; margin-bottom:6px; }
.stamp .sp-t{ font-family:"Noto Serif KR",serif; font-weight:500;
  font-size:14px; color:#D4BC8A; letter-spacing:.1em; text-indent:.1em; white-space:nowrap;
  text-shadow:0 -0.6px 0.5px rgba(74,50,16,.98), 0 0.8px 0.4px rgba(255,253,242,1), 0 0 0.7px rgba(120,90,40,.4); }
/* 곡명 부제 축소 — (Générique) 같은 괄호 부분 */
.titles h1 .sub{ font-size:0.62em; color:var(--faint); font-style:italic;
  font-family:"Cormorant Garamond",serif; letter-spacing:.02em; }
.titles h1{
  margin-top:22px;
  font-size:var(--song-size);
  font-weight:400; letter-spacing:.08em; line-height:1.25;
}
.titles .artist{
  margin-top:10px;
  font-family:"Cormorant Garamond", serif; font-style:italic; font-weight:500;
  font-size:19px; color:var(--mid); letter-spacing:.05em;
}

.titles .romaji{
  margin-top:9px;
  font-family:"Cormorant Garamond", serif;
  font-size:15px; color:var(--faint); letter-spacing:.05em;
}
.titles .romaji:empty{ display:none; }

/* 상단 배치 변형 — 문법은 동일, 순서와 크기만 다름 */
.lay-a{ --song-size:26px; }
.lay-b{ --song-size:28px; }
.lay-c{ --song-size:22px; }
.lay-c .plate{ width:min(72%, 240px); }
.lay-c .stamp{ margin-top:clamp(48px, 8vh, 76px); }
.lay-c .plate{ margin-top:clamp(24px, 4vh, 36px); }
.lay-c .titles{ margin-top:clamp(28px, 5vh, 44px); }
.lay-b .titles{ margin-top:clamp(56px, 9vh, 88px); }
.lay-b .plate{ margin-top:clamp(30px, 5vh, 46px); }
.lay-c .void{ min-height:clamp(360px, 50vh, 540px); }

.void{
  flex:1;
  display:flex; align-items:center; justify-content:center;
  width:100%;
  min-height:clamp(300px, 42vh, 460px);
  padding:clamp(64px, 10vh, 110px) 0;
}
.note{
  width:min(100%, 420px);
  font-size:15.5px; line-height:2.15; color:#332F28; word-break:keep-all;
}
.note p + p{ margin-top:1.6em; }
.note:empty{ display:none; }
.note .credit{
  margin-top:2.8em; text-indent:0;
  font-size:12.5px; line-height:2.05; color:var(--faint);
  letter-spacing:.04em; word-break:keep-all;
}
.note .credit::before{
  content:""; display:block; width:24px; height:1px;
  background:var(--rule); margin-bottom:1.5em;
}
.note .aside{
  margin-top:2.2em; text-indent:0;
  font-size:11px; line-height:1.85; color:var(--faint);
  letter-spacing:.02em; word-break:keep-all; opacity:.85;
}
/* 가사·시 인용 — 왼쪽 세로줄. 문체 지침의 인용 습관을 지면으로 */
.note .lyric{
  margin:2.4em 0; padding-left:1.4em;
  border-left:1px solid var(--rule);
  font-family:"Cormorant Garamond", serif; font-style:italic;
  font-size:16px; line-height:1.9; color:var(--mid);
  letter-spacing:.02em; word-break:keep-all;
}
.note p + .lyric{ margin-top:2.4em; }
.note .lyric + p{ margin-top:2.4em; }

.listen{ text-align:center; padding-bottom:8px; }
.listen-row{
  display:flex; justify-content:center; align-items:center;
  flex-wrap:wrap; column-gap:24px; row-gap:8px;
}
.listen-row + .listen-row{ margin-top:13px; }
.listen-row a{
  display:inline-flex; align-items:center; gap:6px;
  text-decoration:none; color:var(--mid);
  font-size:12px; font-weight:500; letter-spacing:.12em;
  padding:4px 0;
}
.listen-row a.latin{
  font-family:"Cormorant Garamond", serif;
  font-size:14px; letter-spacing:.08em;
}
.listen-row a:hover, .listen-row a:focus-visible{
  color:var(--ink); text-decoration:underline;
  text-underline-offset:5px; text-decoration-thickness:1px;
}
.listen-row a:focus-visible{ outline:none; }
.listen-row svg{ width:13.5px; height:13.5px; flex:0 0 13.5px; }
.listen-row .off{
  display:inline-flex; align-items:center; gap:6px;
  color:#C6C0B4; cursor:default;
  font-size:12px; font-weight:500; letter-spacing:.12em;
  padding:4px 0;
}
.listen-row .off.latin{
  font-family:"Cormorant Garamond", serif;
  font-size:14px; letter-spacing:.08em;
}
.listen-row .off svg{ opacity:.35; }
.listen-row .off::after{
  content:attr(data-off);
  position:absolute; left:50%; transform:translate(-50%, -168%);
  white-space:nowrap; pointer-events:none;
  background:var(--ink); color:var(--paper);
  font-family:"Noto Serif KR", serif; font-style:normal; font-weight:400;
  font-size:10.5px; letter-spacing:.06em;
  padding:5px 9px; border-radius:2px;
  opacity:0; transition:opacity .2s;
}
.listen-row .off{ position:relative; }
.listen-row .off:hover::after{ opacity:.94; }

/* 권리 만료 등으로 재생이 안 되는 서비스 — 표시는 하되 눌러 보이지 않게 */
.listen-row a.na{ color:var(--faint); }
.listen-row a.na svg{ opacity:.42; }
.listen-row a.na:hover, .listen-row a.na:focus-visible{

.lay-photo{ --song-size:24px; }

/* 사진 영역 클릭존 (카드 내 좌5.8/상4.7/폭88.5/높이66%) */
.lay-photo .pola-hit{ position:absolute; left:5.8%; top:4.6%; width:88.5%; height:63.4%;

.lay-photo .pola-play{ position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);

.lay-photo .pola-play::after{ content:""; position:absolute; left:53%; top:50%;
  transform:translate(-50%,-50%); border-style:solid; border-width:10px 0 10px 16px;
  border-color:transparent transparent transparent #fff; }
.lay-photo .pola-hit:hover .pola-play{ background:rgba(20,18,16,.72); }
/* 재생 중: 사진 영역에 iframe 채움 */
.lay-photo .plate.playing .pola-live{ position:absolute; left:5.8%; top:4.7%;
  width:88.5%; height:63.4%; background:#000; }
.lay-photo .plate.playing .pola-live iframe{ width:100%; height:100%; border:0; }
.lay-photo .titles{ display:none; }
.lay-photo .void{ display:none; }
.lay-photo .film{ display:none; }
/* 폰에서 폴라로이드 크게 (작은 폰에서 모서리가 살짝 잘려도 자연스럽게 둔다) */
@media (max-width:520px){
  .lay-photo .plate{ width:92%; }
}
